[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nist-orgthermo-ml"
version = "1.0.0"
description = "Curated thermochemistry database: NIST experimental + QM9 computational ΔfH° for 11,860 organic molecules"
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "rdkit-pypi>=2022.9.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Database",
]
keywords = [
    "thermochemistry",
    "enthalpy of formation",
    "NIST",
    "QM9",
    "DFT",
    "B3LYP",
    "machine learning",
    "molecular property prediction",
    "database",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/anweshpandey/thermo-nist-qm9-database"
Repository = "https://github.com/anweshpandey/thermo-nist-qm9-database"
Issues = "https://github.com/anweshpandey/thermo-nist-qm9-database/issues"
Documentation = "https://github.com/anweshpandey/thermo-nist-qm9-database/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.py$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
